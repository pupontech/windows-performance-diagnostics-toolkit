name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Run pytest
        run: |
          if [ -d .venv ]; then
            .venv/bin/python -m pytest tests/ -q
          else
            python3 -m pytest tests/ -q
          fi

      - name: PowerShell parse gate
        run: |
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "src/Invoke-WindowsPerformanceDiagnostics.ps1",
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Error "Parse errors found: $($errors.Count)"
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          '

  windows-verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Parse gate (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "src\Invoke-WindowsPerformanceDiagnostics.ps1",
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            Write-Error "Parse errors found: $($errors.Count)"
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: Parse gate (pwsh)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "src/Invoke-WindowsPerformanceDiagnostics.ps1",
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            Write-Error "Parse errors found: $($errors.Count)"
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: Run Plan mode
        shell: pwsh
        run: |
          $planDir = Join-Path $env:TEMP "wpd-plan"
          & .\src\Invoke-WindowsPerformanceDiagnostics.ps1 -Mode Plan -OutputDirectory $planDir
          $planFile = Join-Path $planDir "diagnostic-plan.json"
          if (-not (Test-Path $planFile)) {
            Write-Error "diagnostic-plan.json not found at $planFile"
            exit 1
          }

      - name: Collect without consent must fail
        shell: pwsh
        run: |
          try {
            & .\src\Invoke-WindowsPerformanceDiagnostics.ps1 -Mode Collect -OutputDirectory (Join-Path $env:TEMP "wpd-no-consent")
            Write-Error "Expected Collect without -ConfirmLocalCollection to fail"
            exit 1
          } catch {
            if ($_.Exception.Message -notmatch "requires -ConfirmLocalCollection") {
              Write-Error "Unexpected error: $($_.Exception.Message)"
              exit 1
            }
          }

      - name: Collect with consent but no WPR consent must fail
        shell: pwsh
        run: |
          try {
            & .\src\Invoke-WindowsPerformanceDiagnostics.ps1 `
              -Mode Collect `
              -ConfirmLocalCollection `
              -CaptureWpr `
              -OutputDirectory (Join-Path $env:TEMP "wpd-no-wpr")
            Write-Error "Expected Collect without -ConfirmWprCapture to fail"
            exit 1
          } catch {
            if ($_.Exception.Message -notmatch "requires -ConfirmWprCapture") {
              Write-Error "Unexpected error: $($_.Exception.Message)"
              exit 1
            }
          }

      - name: Collect with consent but no Defender consent must fail
        shell: pwsh
        run: |
          try {
            & .\src\Invoke-WindowsPerformanceDiagnostics.ps1 `
              -Mode Collect `
              -ConfirmLocalCollection `
              -CaptureDefender `
              -OutputDirectory (Join-Path $env:TEMP "wpd-no-defender")
            Write-Error "Expected Collect without -ConfirmDefenderCapture to fail"
            exit 1
          } catch {
            if ($_.Exception.Message -notmatch "requires -ConfirmDefenderCapture") {
              Write-Error "Unexpected error: $($_.Exception.Message)"
              exit 1
            }
          }

      - name: Invalid OutputDirectory yields a clear error
        shell: pwsh
        run: |
          try {
            & .\src\Invoke-WindowsPerformanceDiagnostics.ps1 `
              -Mode Plan `
              -OutputDirectory "C:\Temp\wpd-bad|path"
            Write-Error "Expected an invalid path to fail"
            exit 1
          } catch {
            if ($_.Exception.Message -notmatch "is not a valid local path") {
              Write-Error "Unexpected error: $($_.Exception.Message)"
              exit 1
            }
          }

      - name: Run the real launcher (Run-Diagnostics.bat)
        shell: cmd
        run: call Run-Diagnostics.bat

      - name: Run the START-HERE menu in auto mode (option 2, basic collect)
        shell: cmd
        run: call START-HERE.bat 2

      - name: Run the START-HERE menu in auto mode (option 4, plan only)
        shell: cmd
        run: call START-HERE.bat 4

      - name: Assert launchers produced the diagnostic artifacts
        shell: pwsh
        run: |
          $manifest = "C:\Temp\WPD-Case\diagnostic-manifest.json"
          $plan = "C:\Temp\WPD-Case\diagnostic-plan.json"
          foreach ($file in @($manifest, $plan)) {
            if (-not (Test-Path -LiteralPath $file)) {
              Write-Error "Launcher did not produce $file"
              exit 1
            }
          }
          $m = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($m.mode -ne "Collect") {
            Write-Error "Unexpected manifest mode: $($m.mode)"
            exit 1
          }
          if ($m.network.status -ne "completed") {
            Write-Error "Unexpected network.status: $($m.network.status)"
            exit 1
          }
          if ($m.network.dnsVsPing.verdict -notin @("dns-and-connectivity-ok","dns-failure","icmp-blocked-or-partial","connectivity-failure","inconclusive")) {
            Write-Error "Unexpected dnsVsPing verdict: $($m.network.dnsVsPing.verdict)"
            exit 1
          }
          if (-not (Test-Path -LiteralPath "C:\Temp\WPD-Case\network-state.json")) {
            Write-Error "network-state.json missing"
            exit 1
          }
          if (@($m.artifacts | Where-Object { $_.Name -eq "network-state.json" }).Count -ne 1) {
            Write-Error "network-state.json not listed in manifest hashes"
            exit 1
          }
          $p = Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          if ($p.mode -ne "Plan") {
            Write-Error "Unexpected plan mode: $($p.mode)"
            exit 1
          }
          if ($p.plannedActions -notcontains "collect-network-state-after-explicit-consent") {
            Write-Error "Plan does not advertise network-state collection"
            exit 1
          }
          Write-Output "Launchers OK: $manifest (toolVersion $($m.toolVersion)), $plan (toolVersion $($p.toolVersion)); network verdict $($m.network.dnsVsPing.verdict), security matches $($m.network.securitySoftwareMatches.processMatches)/$($m.network.securitySoftwareMatches.installedSoftwareMatches)"

  # WPD-08/09/10: WPR consent + elevation gates on a real Windows VM
  # (GitHub-hosted windows-2022/windows-2025 runner = the owner-provided Windows
  #  environment; elevated by default, Windows PowerShell 5.1, real wpr.exe).
  # WPD-08 consent refusal and WPD-10 elevated capture run directly in the
  # runner context; WPD-09 drops to a standard local user via a scheduled task
  # to verify the no-UAC / no-auto-elevation path.
  wpd-live-gates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: WPD-08 - WPR capture without consent must refuse before collection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\WPD'
          $logsDir = Join-Path $base 'logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $outDir = Join-Path $base 'WPD-08'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $log = Join-Path $logsDir 'WPD-08-console.log'
          $wps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $wps -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\src\Invoke-WindowsPerformanceDiagnostics.ps1" `
            -Mode Collect -ConfirmLocalCollection -CaptureWpr -DurationSeconds 5 -OutputDirectory $outDir *>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          if ($exit -eq 0) { throw "WPD-08 FAIL: expected refusal without -ConfirmWprCapture (exit 0)" }
          $output = Get-Content -LiteralPath $log -Raw
          if ($output -notmatch 'WPR capture requires -ConfirmWprCapture\. No diagnostic data was collected\.') {
            throw "WPD-08 FAIL: consent message not found in console output: $output"
          }
          $artifacts = @(Get-ChildItem -LiteralPath $outDir -File)
          if ($artifacts.Count -gt 0) { throw "WPD-08 FAIL: unexpected artifacts: $($artifacts.Name -join ', ')" }
          Write-Output "WPD-08 PASS: refused with consent message, no artifacts, exit $exit"
          exit 0

      - name: WPR environment diagnostics (evidence for WPD-10)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = 'C:\WPD'
          $logsDir = Join-Path $base 'logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $diag = Join-Path $logsDir 'wpr-diagnostics.txt'
          $wprExe = Join-Path $env:SystemRoot 'System32\wpr.exe'
          "wpr.exe exists: $(Test-Path -LiteralPath $wprExe)" | Out-File -FilePath $diag -Encoding utf8
          if (Test-Path -LiteralPath $wprExe) {
            "wpr.exe version: $((Get-Item -LiteralPath $wprExe).VersionInfo.FileVersion)" | Out-File -FilePath $diag -Append -Encoding utf8
            "--- wpr -profiles ---" | Out-File -FilePath $diag -Append -Encoding utf8
            & $wprExe -profiles 2>&1 | Out-File -FilePath $diag -Append -Encoding utf8
            "--- System32\wpr folder ---" | Out-File -FilePath $diag -Append -Encoding utf8
            if (Test-Path -LiteralPath "$env:SystemRoot\System32\wpr") {
              Get-ChildItem -LiteralPath "$env:SystemRoot\System32\wpr" | Select-Object Name, Length | Out-File -FilePath $diag -Append -Encoding utf8
            } else {
              "System32\wpr folder does not exist" | Out-File -FilePath $diag -Append -Encoding utf8
            }
            "--- raw wpr -start General -filemode ---" | Out-File -FilePath $diag -Append -Encoding utf8
            & $wprExe -start General -filemode 2>&1 | Out-File -FilePath $diag -Append -Encoding utf8
            "start exit code: $LASTEXITCODE" | Out-File -FilePath $diag -Append -Encoding utf8
            & $wprExe -stop (Join-Path $logsDir 'wpr-diag-trace.etl') 2>&1 | Out-File -FilePath $diag -Append -Encoding utf8
            "stop exit code: $LASTEXITCODE" | Out-File -FilePath $diag -Append -Encoding utf8
            "--- raw wpr -start GeneralProfile -filemode ---" | Out-File -FilePath $diag -Append -Encoding utf8
            & $wprExe -start GeneralProfile -filemode 2>&1 | Out-File -FilePath $diag -Append -Encoding utf8
            "start exit code: $LASTEXITCODE" | Out-File -FilePath $diag -Append -Encoding utf8
            & $wprExe -stop (Join-Path $logsDir 'wpr-diag-generalprofile-trace.etl') 2>&1 | Out-File -FilePath $diag -Append -Encoding utf8
            "stop exit code: $LASTEXITCODE" | Out-File -FilePath $diag -Append -Encoding utf8
          }
          Get-Content -LiteralPath $diag | ForEach-Object { Write-Output "WPRDIAG: $_" }
          exit 0

      - name: WPD-10 - WPR capture from elevated console
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\WPD'
          $logsDir = Join-Path $base 'logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $outDir = Join-Path $base 'WPD-10'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $isElevated = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isElevated) { throw "WPD-10 FAIL: runner console is not elevated" }
          $log = Join-Path $logsDir 'WPD-10-console.log'
          $wps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $wps -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\src\Invoke-WindowsPerformanceDiagnostics.ps1" `
            -Mode Collect -ConfirmLocalCollection -CaptureWpr -ConfirmWprCapture -DurationSeconds 5 -OutputDirectory $outDir *>&1 | Tee-Object -FilePath $log
          $scriptExit = $LASTEXITCODE
          $manifestPath = Join-Path $outDir 'diagnostic-manifest.json'
          $manifest = $null
          if (Test-Path -LiteralPath $manifestPath) {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          }
          $wprStatus = if ($manifest -and $manifest.wpr) { $manifest.wpr.status } else { 'manifest-wpr-block-missing' }
          $etl = Join-Path $outDir 'wpr-trace.etl'
          $etlExists = Test-Path -LiteralPath $etl
          $etlBytes = if ($etlExists) { (Get-Item -LiteralPath $etl).Length } else { 0 }
          $wprError = @($manifest.collectionErrors | Where-Object { $_.Stage -eq 'wpr-capture' } | ForEach-Object { $_.Message }) -join ' | '
          Write-Output "WPD-10 observed: scriptExit=$scriptExit wpr.status=$wprStatus etlExists=$etlExists etlBytes=$etlBytes wprError='$wprError'"
          if ($wprStatus -ne 'completed' -or -not $etlExists -or $etlBytes -eq 0) {
            throw "WPD-10 FAIL: expected wpr.status=completed with non-empty wpr-trace.etl; observed status=$wprStatus etlBytes=$etlBytes wprError='$wprError' (full console: $log)"
          }
          $inHashes = @($manifest.artifacts | Where-Object { $_.Name -eq 'wpr-trace.etl' })
          if ($inHashes.Count -ne 1) { throw 'WPD-10 FAIL: wpr-trace.etl not listed in manifest hashes' }
          Write-Output "WPD-10 PASS: wpr-trace.etl $etlBytes bytes, wpr.status completed, hashed in manifest"
          exit 0

      - name: WPD-09 - WPR on standard (non-admin) console is skipped, no elevation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\WPD'
          $logsDir = Join-Path $base 'logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          $outDir = Join-Path $base 'WPD-09'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $user = 'wpdstd'
          $pass = 'Wpd#2026!Test'
          net user $user $pass /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'WPD-09 FAIL: net user /add failed' }
          # grant the standard user write access to the staging area
          icacls $base /grant "${user}:(OI)(CI)M" | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\src\Invoke-WindowsPerformanceDiagnostics.ps1" `
            -Destination (Join-Path $base 'Invoke-WindowsPerformanceDiagnostics.ps1') -Force
          icacls (Join-Path $base 'Invoke-WindowsPerformanceDiagnostics.ps1') /grant "${user}:R" | Out-Null
          # grant "Log on as a batch job" so a password-based process start works
          $sid = (New-Object System.Security.Principal.NTAccount($user)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $secCfg = Join-Path $base 'sec.cfg'
          secedit /export /cfg $secCfg /areas USER_RIGHTS | Out-Null
          $cfg = Get-Content -LiteralPath $secCfg -Raw
          if ($cfg -match 'SeBatchLogonRight\s*=\s*[^\r\n]*') {
            $cfg = $cfg -replace 'SeBatchLogonRight\s*=\s*[^\r\n]*', "SeBatchLogonRight = *S-1-5-32-544,*S-1-5-32-551,*$sid"
          } else {
            $cfg = $cfg + "`r`nSeBatchLogonRight = *S-1-5-32-544,*S-1-5-32-551,*$sid`r`n"
          }
          Set-Content -LiteralPath $secCfg -Value $cfg -Encoding Ascii
          secedit /configure /db secedit.sdb /cfg $secCfg /areas USER_RIGHTS | Out-Null
          $consoleLog = Join-Path $logsDir 'WPD-09-console.log'
          $cred = New-Object System.Management.Automation.PSCredential($user, (ConvertTo-SecureString $pass -AsPlainText -Force))
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $base + '\Invoke-WindowsPerformanceDiagnostics.ps1" -Mode Collect -ConfirmLocalCollection -CaptureWpr -ConfirmWprCapture -DurationSeconds 5 -OutputDirectory "' + $outDir + '"'
          $psi.UseShellExecute = $false
          $psi.UserName = $user
          $psi.Domain = $env:COMPUTERNAME
          $psi.Password = (ConvertTo-SecureString $pass -AsPlainText -Force)
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::Start($psi)
          $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          if (-not $proc.WaitForExit(120000)) {
            try { $proc.Kill() } catch { }
            throw 'WPD-09 FAIL: standard-user process did not finish within 120s'
          }
          $exit = $proc.ExitCode
          $stdoutTask.Wait(5000) | Out-Null
          $stderrTask.Wait(5000) | Out-Null
          ("--- stdout ---`n" + $stdoutTask.Result + "`n--- stderr ---`n" + $stderrTask.Result) | Set-Content -LiteralPath $consoleLog -Encoding utf8
          if ($exit -ne 0) { throw "WPD-09 FAIL: script exit code $exit; see $consoleLog" }
          $manifest = Get-Content -LiteralPath (Join-Path $outDir 'diagnostic-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.wpr.status -ne 'skipped-elevation-required') {
            throw "WPD-09 FAIL: wpr.status=$($manifest.wpr.status)"
          }
          $wprErrors = @($manifest.collectionErrors | Where-Object { $_.Stage -eq 'wpr-capture' })
          if ($wprErrors.Count -lt 1) { throw 'WPD-09 FAIL: no wpr-capture collectionErrors entry' }
          if ($wprErrors[0].Message -notmatch 'elevated') {
            throw "WPD-09 FAIL: unexpected wpr-capture error: $($wprErrors[0].Message)"
          }
          if (Test-Path -LiteralPath (Join-Path $outDir 'wpr-trace.etl')) { throw 'WPD-09 FAIL: wpr-trace.etl must NOT exist' }
          Write-Output "WPD-09 PASS: wpr.status=skipped-elevation-required, no ETL, no elevation attempted"
          exit 0

      - name: Upload WPD-08/09/10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpd-gates-${{ matrix.os }}
          path: |
            C:\WPD
            !C:\WPD\**\*.etl
            !C:\WPD\**\*.NGENPDB
          if-no-files-found: error

  # WPD-11: release zip + Mark-of-the-Web (MOTW) + launcher end-to-end
  # (windows-live-test-matrix.md WPD-11). Runs on the owner's GitHub-hosted
  # Windows runners (real Windows VMs; Server SKUs - client-specific Defender
  # real-time-protection quarantine behavior remains an owner spot-check on a
  # Win10/11 client per the live-test runbook). Flow: download the release zip
  # (MOTW stamped), verify hash vs the .sha256 asset, extract WITHOUT unblock
  # and observe MOTW inheritance + Defender action, exercise the recovery leg
  # (Protection-history restore equivalent) when Defender quarantines, then
  # Unblock-File, re-extract clean, verify per-file hashes against the tag
  # source, and confirm the launcher runs from the extracted folder.
  wpd-release-flow:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    env:
      WPD11_WORK: C:\WPD11
    steps:
      - uses: actions/checkout@v4

      - name: WPD-11 - resolve latest release (tag + assets)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve the latest semver tag without the API (auth-free): asset URLs are
          # deterministic (https://github.com/<owner>/<repo>/releases/download/<tag>/...).
          # `origin` is wired to GitHub credentials by actions/checkout.
          $lines = @(git ls-remote --tags --refs origin)
          if ($LASTEXITCODE -ne 0 -or $lines.Count -eq 0) { throw 'WPD-11 FAIL: git ls-remote failed to enumerate release tags' }
          $versions = foreach ($l in $lines) {
            $t = ($l -split 'refs/tags/')[-1].Trim()
            if ($t -match '^v\d+\.\d+\.\d+$') { [pscustomobject]@{ tag = $t; ver = [version]$t.TrimStart('v') } }
          }
          if (-not $versions) { throw 'WPD-11 FAIL: no semver tags found via git ls-remote' }
          $latest = $versions | Sort-Object ver | Select-Object -Last 1
          $tag = $latest.tag
          $ver = $latest.ver.ToString()
          $base = "windows-performance-diagnostics-toolkit-$ver"
          $zipUrl = "https://github.com/pupontech/windows-performance-diagnostics-toolkit/releases/download/$tag/$base.zip"
          $shaUrl = "https://github.com/pupontech/windows-performance-diagnostics-toolkit/releases/download/$tag/$base.sha256"
          New-Item -ItemType Directory -Force -Path $env:WPD11_WORK | Out-Null
          $state = [ordered]@{
            tag = $tag
            ver = $ver
            base = $base
            zipUrl = $zipUrl
            shaUrl = $shaUrl
            zipPath = Join-Path $env:WPD11_WORK "$base.zip"
            shaPath = Join-Path $env:WPD11_WORK "$base.sha256"
          }
          $state | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Encoding utf8
          Write-Output "WPD-11 resolved: $tag -> $base.zip"

      - name: WPD-11 - download zip (MOTW) + record Defender environment evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $evidence = Join-Path $env:WPD11_WORK 'wpd-11-evidence.log'
          "=== WPD-11 environment evidence ($env:COMPUTERNAME) ===" | Out-File -FilePath $evidence -Encoding utf8
          "OS: $([System.Environment]::OSVersion.VersionString) (build $([System.Environment]::OSVersion.Version))" | Out-File -FilePath $evidence -Append -Encoding utf8
          "Release under test: $($state.tag)" | Out-File -FilePath $evidence -Append -Encoding utf8
          # PRIVATE repo: release assets require the workflow token. Observed: the web
          # releases/download route 404s for this repo even for the owner, so the
          # canonical API asset route is used. Windows PowerShell 5.1 Invoke-WebRequest
          # stamps Zone.Identifier (MOTW); pwsh 7 does not, so this step is 5.1.
          $zipAsset = $null
          $shaAsset = $null
          try {
            $assetLines = gh api "repos/pupontech/windows-performance-diagnostics-toolkit/releases/tags/$($state.tag)" --jq '.assets[] | .name + "|" + .url' 2>$null
            foreach ($l in @($assetLines)) {
              $p = $l.Split('|', 2)
              if ($p[0] -eq "$($state.base).zip") { $zipAsset = $p[1] }
              if ($p[0] -eq "$($state.base).sha256") { $shaAsset = $p[1] }
            }
            "API probe (gh api releases/tags/$($state.tag)): zipAsset=$([bool]$zipAsset) shaAsset=$([bool]$shaAsset)" | Out-File -FilePath $evidence -Append -Encoding utf8
          } catch {
            "API probe (gh api) failed: $($_.Exception.Message)" | Out-File -FilePath $evidence -Append -Encoding utf8
          }
          $method = $null
          if ($zipAsset) {
            try {
              Invoke-WebRequest -Uri $zipAsset -OutFile $state.zipPath -UseBasicParsing -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/octet-stream' }
              if (Get-Item -LiteralPath $state.zipPath -Stream Zone.Identifier -ErrorAction SilentlyContinue) { $method = 'iwr-5.1' }
            } catch { "IWR api-asset download failed: $($_.Exception.Message)" | Out-File -FilePath $evidence -Append -Encoding utf8 }
          }
          if (-not $method -and $zipAsset) {
            "IWR did not yield a MOTW-stamped zip; trying curl.exe" | Out-File -FilePath $evidence -Append -Encoding utf8
            if (Test-Path -LiteralPath $state.zipPath) { Remove-Item -LiteralPath $state.zipPath -Force }
            & curl.exe -sSL --fail -o $state.zipPath -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" $zipAsset
            if ($LASTEXITCODE -eq 0) {
              if (Get-Item -LiteralPath $state.zipPath -Stream Zone.Identifier -ErrorAction SilentlyContinue) { $method = 'curl' }
              else { "curl.exe downloaded zip but NO Zone.Identifier stamp" | Out-File -FilePath $evidence -Append -Encoding utf8 }
            } else { "curl.exe api-asset download failed (exit $LASTEXITCODE)" | Out-File -FilePath $evidence -Append -Encoding utf8 }
          }
          if (-not (Test-Path -LiteralPath $state.zipPath)) {
            "Falling back to gh release download (exact bytes, but NO MOTW stamp expected)" | Out-File -FilePath $evidence -Append -Encoding utf8
            gh release download $state.tag -R pupontech/windows-performance-diagnostics-toolkit -p "$($state.base).zip" -p "$($state.base).sha256" -D $env:WPD11_WORK --clobber
            $method = 'gh-release-download'
          } elseif (-not (Test-Path -LiteralPath $state.shaPath)) {
            gh release download $state.tag -R pupontech/windows-performance-diagnostics-toolkit -p "$($state.base).sha256" -D $env:WPD11_WORK --clobber
          }
          if ($method) {
            $zoneId = ((Get-Content -LiteralPath $state.zipPath -Stream Zone.Identifier -ErrorAction SilentlyContinue) | Where-Object { $_ -match '^ZoneId=' }) -join ';'
            "MOTW: zip downloaded via $method [Zone.Identifier: $zoneId]" | Out-File -FilePath $evidence -Append -Encoding utf8
          } else {
            "MOTW: zip download did not produce Zone.Identifier - scenario not reproducible on this runner" | Out-File -FilePath $evidence -Append -Encoding utf8
          }
          $zip = Get-Item -LiteralPath $state.zipPath
          "Zip size: $($zip.Length) bytes" | Out-File -FilePath $evidence -Append -Encoding utf8
          "--- Defender status ---" | Out-File -FilePath $evidence -Append -Encoding utf8
          try {
            Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated,AMProductVersion | Format-List | Out-String | Out-File -FilePath $evidence -Append -Encoding utf8
          } catch { "Get-MpComputerStatus unavailable: $($_.Exception.Message)" | Out-File -FilePath $evidence -Append -Encoding utf8 }
          try {
            $pref = Get-MpPreference
            "ExclusionPath: $($pref.ExclusionPath -join '; ')" | Out-File -FilePath $evidence -Append -Encoding utf8
            "ExclusionProcess: $($pref.ExclusionProcess -join '; ')" | Out-File -FilePath $evidence -Append -Encoding utf8
            "DisableRealtimeMonitoring: $($pref.DisableRealtimeMonitoring)" | Out-File -FilePath $evidence -Append -Encoding utf8
          } catch { "Get-MpPreference unavailable: $($_.Exception.Message)" | Out-File -FilePath $evidence -Append -Encoding utf8 }
          Get-Content -LiteralPath $evidence | ForEach-Object { Write-Output "WPD11ENV: $_" }
          if (-not (Test-Path -LiteralPath $state.zipPath)) { throw 'WPD-11 FAIL: release zip could not be acquired on this runner (IWR + curl + gh release download all failed; see wpd-11-evidence.log)' }
          if (-not $method -or $method -eq 'gh-release-download') {
            throw 'WPD-11 FAIL: Mark-of-the-Web (Zone.Identifier) could not be produced on this runner; MOTW leg requires a real internet download'
          }

      - name: WPD-11 - zip hash must match the .sha256 asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $assetText = Get-Content -LiteralPath $state.shaPath -Raw
          if ($assetText -notmatch '([0-9a-fA-F]{64})') { throw "WPD-11 FAIL: .sha256 asset unparseable: $assetText" }
          $expected = $Matches[1].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $state.zipPath).Hash.ToLower()
          Write-Output "WPD-11 hash: asset=$expected actual=$actual"
          if ($actual -ne $expected) { throw "WPD-11 FAIL: zip hash mismatch (asset $expected vs downloaded $actual)" }
          Write-Output 'WPD-11 PASS: downloaded zip hash matches the published .sha256 asset'

      - name: WPD-11 - extract WITHOUT unblock; observe MOTW inheritance + Defender action
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem } catch { }
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $evidence = Join-Path $env:WPD11_WORK 'wpd-11-extract.log'
          $zipAbs = (Resolve-Path -LiteralPath $state.zipPath).Path
          $extract1 = Join-Path $env:WPD11_WORK 'extract-motw'
          New-Item -ItemType Directory -Force -Path $extract1 | Out-Null
          # Explorer-equivalent extraction (Shell.Application CopyHere mirrors the documented
          # user flow "right-click zip -> Extract All", including MOTW propagation).
          $shell = New-Object -ComObject Shell.Application
          $src = $shell.Namespace($zipAbs)
          $dst = $shell.Namespace($extract1)
          $dst.CopyHere($src.Items(), 0x14)
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead($zipAbs)
          $expectedCount = $zipArchive.Entries.Count
          $zipArchive.Dispose()
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Milliseconds 500
            $actualCount = @(Get-ChildItem -LiteralPath $extract1 -Recurse -File).Count
          } while ($actualCount -lt $expectedCount -and (Get-Date) -lt $deadline)
          if ($actualCount -lt $expectedCount) { throw "WPD-11 FAIL: extraction incomplete ($actualCount/$expectedCount files)" }
          $root = Join-Path $extract1 $state.base
          $ps1 = Join-Path $root 'src\Invoke-WindowsPerformanceDiagnostics.ps1'
          "Extracted $actualCount files to $extract1 (zip has $expectedCount entries)" | Out-File -FilePath $evidence -Encoding utf8
          $ps1Item = Get-Item -LiteralPath $ps1 -ErrorAction SilentlyContinue
          if ($ps1Item) {
            $zi = Get-Item -LiteralPath $ps1 -Stream Zone.Identifier -ErrorAction SilentlyContinue
            if ($zi) {
              $zoneId = ((Get-Content -LiteralPath $ps1 -Stream Zone.Identifier -ErrorAction SilentlyContinue) | Where-Object { $_ -match '^ZoneId=' }) -join ';'
              "MOTW inheritance: extracted .ps1 HAS Zone.Identifier [$zoneId]; Defender did not remove it" | Out-File -FilePath $evidence -Append -Encoding utf8
            } else {
              "MOTW inheritance: extracted .ps1 has NO Zone.Identifier (shell CopyHere did not propagate the ADS on this platform)" | Out-File -FilePath $evidence -Append -Encoding utf8
            }
          } else {
            "DEFENDER ACTION: extracted .ps1 is MISSING after MOTW extraction - Defender quarantined it" | Out-File -FilePath $evidence -Append -Encoding utf8
          }
          "--- extracted root listing ---" | Out-File -FilePath $evidence -Append -Encoding utf8
          Get-ChildItem -LiteralPath $root | Select-Object Name,Length | Out-String | Out-File -FilePath $evidence -Append -Encoding utf8
          Get-Content -LiteralPath $evidence | ForEach-Object { Write-Output "WPD11X: $_" }

      - name: WPD-11 - Defender quarantine / Protection-history recovery leg
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $evidence = Join-Path $env:WPD11_WORK 'wpd-11-defender.log'
          $root = Join-Path (Join-Path $env:WPD11_WORK 'extract-motw') $state.base
          $ps1 = Join-Path $root 'src\Invoke-WindowsPerformanceDiagnostics.ps1'
          $missing = -not (Test-Path -LiteralPath $ps1)
          "ps1 missing after MOTW extraction: $missing" | Out-File -FilePath $evidence -Encoding utf8
          try {
            $threats = @(Get-MpThreat -ErrorAction Stop)
            "Threats detected by Defender: $($threats.Count)" | Out-File -FilePath $evidence -Append -Encoding utf8
            $threats | Select-Object ThreatID,ThreatName,@{n='Resources';e={$_.Resources -join ';'}} | Out-String | Out-File -FilePath $evidence -Append -Encoding utf8
            if ($missing -and $threats.Count -gt 0) {
              # CLI equivalent of Windows Security -> Protection history -> Restore:
              # Remove-MpThreat without -Remove restores the quarantined item.
              foreach ($t in $threats) { Remove-MpThreat -ThreatID $t.ThreatID -ErrorAction Continue | Out-Null }
              Start-Sleep -Seconds 3
              if (Test-Path -LiteralPath $ps1) {
                "RECOVERY: .ps1 restored via Remove-MpThreat (Protection-history Restore equivalent)" | Out-File -FilePath $evidence -Append -Encoding utf8
              } else {
                "RECOVERY: .ps1 still missing after Remove-MpThreat - owner must use the GUI Protection-history Restore" | Out-File -FilePath $evidence -Append -Encoding utf8
              }
            }
          } catch {
            "Get-MpThreat unavailable: $($_.Exception.Message)" | Out-File -FilePath $evidence -Append -Encoding utf8
          }
          if (-not $missing) {
            "Defender did not quarantine the .ps1 on this runner (see wpd-11-evidence.log: RealTimeProtectionEnabled=$((Get-MpComputerStatus -ErrorAction SilentlyContinue).RealTimeProtectionEnabled), exclusions)" | Out-File -FilePath $evidence -Append -Encoding utf8
          }
          Get-Content -LiteralPath $evidence | ForEach-Object { Write-Output "WPD11D: $_" }

      - name: WPD-11 - Unblock-File, re-extract clean, verify hashes vs tag sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $evidence = Join-Path $env:WPD11_WORK 'wpd-11-unblock-hash.log'
          # Unblock the zip exactly as documented in README-FIRST.txt
          # (Properties -> Unblock is the GUI; Unblock-File is the CLI equivalent).
          Unblock-File -Path $state.zipPath
          $zi = Get-Item -LiteralPath $state.zipPath -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zi) { throw 'WPD-11 FAIL: Unblock-File did not clear Zone.Identifier from the zip' }
          "Unblock-File cleared Zone.Identifier from the zip" | Out-File -FilePath $evidence -Encoding utf8
          $extract2 = Join-Path $env:WPD11_WORK 'extract-clean'
          Expand-Archive -LiteralPath $state.zipPath -DestinationPath $extract2 -Force
          $root = Join-Path $extract2 $state.base
          # WPD-11 required files present?
          $required = @('START-HERE.bat','Run-Diagnostics.bat','README-FIRST.txt','src\Invoke-WindowsPerformanceDiagnostics.ps1')
          foreach ($rel in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $rel))) { throw "WPD-11 FAIL: $rel missing from clean extraction" }
          }
          $ps1 = Join-Path $root 'src\Invoke-WindowsPerformanceDiagnostics.ps1'
          # README-FIRST.txt one-time unblock of the extracted script
          Unblock-File -Path $ps1
          $ps1zi = Get-Item -LiteralPath $ps1 -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($ps1zi) { throw 'WPD-11 FAIL: extracted .ps1 still has Zone.Identifier after Unblock-File' }
          "Required files present; extracted .ps1 unblocked (no Zone.Identifier)" | Out-File -FilePath $evidence -Append -Encoding utf8
          # Per-file hash verification against the tag source on GitHub (the zip is
          # built with `git archive HEAD` at the tag, so bytes must match exactly;
          # private repo, so raw fetches carry the workflow token).
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $files = @('src\Invoke-WindowsPerformanceDiagnostics.ps1','Run-Diagnostics.bat','START-HERE.bat','README-FIRST.txt','VERSION')
          foreach ($rel in $files) {
            $extracted = Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $rel)
            $rawUrl = "https://raw.githubusercontent.com/pupontech/windows-performance-diagnostics-toolkit/$($state.tag)/$($rel -replace '\\','/')"
            $tmp = Join-Path $env:WPD11_WORK ('raw-' + ($rel -replace '[\\/]','-'))
            Invoke-WebRequest -Uri $rawUrl -OutFile $tmp -UseBasicParsing -Headers $headers
            $rawHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tmp).Hash
            $match = ($extracted.Hash -eq $rawHash)
            "$rel : extracted=$($extracted.Hash) tag@$($state.tag)=$rawHash match=$match" | Out-File -FilePath $evidence -Append -Encoding utf8
            if (-not $match) { throw "WPD-11 FAIL: $rel hash differs from tag $($state.tag) source" }
          }
          $verFile = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          if ($verFile -ne $state.ver) { throw "WPD-11 FAIL: VERSION in zip ($verFile) != release version ($($state.ver))" }
          "VERSION in zip matches release tag: $verFile" | Out-File -FilePath $evidence -Append -Encoding utf8
          Get-Content -LiteralPath $evidence | ForEach-Object { Write-Output "WPD11U: $_" }
          Write-Output "WPD-11 PASS: unblock + clean extraction + per-file hashes vs tag $($state.tag) all match"

      - name: WPD-11 - launcher end-to-end from the extracted (unblocked) folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath (Join-Path $env:WPD11_WORK 'state.json') -Raw | ConvertFrom-Json
          $root = Join-Path (Join-Path $env:WPD11_WORK 'extract-clean') $state.base
          Push-Location $root
          try {
            cmd.exe /c "call Run-Diagnostics.bat"
            $exit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($exit -ne 0) { throw "WPD-11 FAIL: Run-Diagnostics.bat exited $exit" }
          $manifestPath = 'C:\Temp\WPD-Case\diagnostic-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "WPD-11 FAIL: launcher produced no $manifestPath" }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.mode -ne 'Collect') { throw "WPD-11 FAIL: manifest mode=$($manifest.mode) (expected Collect)" }
          if ($manifest.toolVersion -ne $state.ver) { throw "WPD-11 FAIL: manifest toolVersion=$($manifest.toolVersion) (expected $($state.ver))" }
          foreach ($a in @('performance-samples.csv','top-processes.json','system-events-last-24-hours.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'C:\Temp\WPD-Case' $a))) { throw "WPD-11 FAIL: launcher produced no $a" }
            if (@($manifest.artifacts | Where-Object { $_.Name -eq $a }).Count -ne 1) { throw "WPD-11 FAIL: $a missing from manifest hashes" }
          }
          Write-Output "WPD-11 PASS: Run-Diagnostics.bat from extracted folder -> $manifestPath (toolVersion $($manifest.toolVersion), mode $($manifest.mode), artifacts hashed)"

      - name: Upload WPD-11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpd-11-${{ matrix.os }}
          path: |
            C:\WPD11
            C:\Temp\WPD-Case\diagnostic-manifest.json
          if-no-files-found: warn
