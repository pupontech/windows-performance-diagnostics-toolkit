name: WPD probe (temporary)

on:
  push:
    branches: [feat/crash-servicing-findings]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Probe child-process environment for the collector invocation
        shell: pwsh
        run: |
          $wps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          "parent host: $($PSVersionTable.PSVersion.ToString())"
          "parent PSModulePath: $env:PSModulePath"
          $childLines = @(
            'Write-Output ("child host: " + $PSVersionTable.PSVersion.ToString())',
            'Write-Output ("child PSModulePath: " + $env:PSModulePath)',
            'Write-Output ("child Get-FileHash: " + [string]((Get-Command Get-FileHash -ErrorAction SilentlyContinue).Name))',
            'Write-Output ("child Get-WinEvent: " + [string]((Get-Command Get-WinEvent -ErrorAction SilentlyContinue).Name))'
          )
          $childScript = $childLines -join "`n"
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes($childScript))

          "=== LEG1: call operator ==="
          $out1 = & $wps -NoProfile -NonInteractive -EncodedCommand $encoded 2>&1
          ($out1 | ForEach-Object { "leg1: $_" })

          function Start-ProbeLeg {
            param([string]$Label, [bool]$CopyEnvironment, [string]$ModulePath)
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $wps
            $psi.Arguments = "-NoProfile -NonInteractive -EncodedCommand $encoded"
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
            if ($CopyEnvironment) {
              foreach ($entry in [System.Environment]::GetEnvironmentVariables().GetEnumerator()) {
                $psi.EnvironmentVariables[[string]$entry.Key] = [string]$entry.Value
              }
            }
            if ($ModulePath) { $psi.EnvironmentVariables['PSModulePath'] = $ModulePath }
            $process = [System.Diagnostics.Process]::Start($psi)
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            "=== $Label (exit $($process.ExitCode)) ==="
            ($stdout -split "`r?`n" | Where-Object { $_ } | ForEach-Object { "$Label`: $_" })
            if ($stderr) { "$Label STDERR: $stderr" }
          }

          Start-ProbeLeg -Label 'LEG2-ProcessStart-inherited' -CopyEnvironment $false -ModulePath ''
          Start-ProbeLeg -Label 'LEG3-ProcessStart-env-copied' -CopyEnvironment $true -ModulePath ''
          $defaultModulePath = @(
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'),
            (Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules')
          ) -join ';'
          Start-ProbeLeg -Label 'LEG4-ProcessStart-modulepath-5.1' -CopyEnvironment $true -ModulePath $defaultModulePath

          "=== LEG5: same-process env read for comparison ==="
          "leg5 filehash: $((Get-Command Get-FileHash -ErrorAction SilentlyContinue).Name)"
          exit 0
